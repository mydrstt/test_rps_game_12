<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>AI 가위바위보</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Pretendard','Noto Sans KR',sans-serif;color:#eef1ff;background:#0b1020;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% -15%,#243d70 0%,transparent 56%),#0b1020;display:grid;place-items:center;padding:22px}
    .app{width:min(100%,510px);padding:28px;border:1px solid #ffffff21;background:linear-gradient(145deg,#ffffff15,#ffffff07);box-shadow:0 30px 80px #0006;border-radius:32px;backdrop-filter:blur(25px)}
    .eyebrow{font-size:12px;letter-spacing:.22em;color:#9db2f9;font-weight:800;text-transform:uppercase;text-align:center}.heading{text-align:center;margin:10px 0 8px;font-size:clamp(28px,6vw,40px);letter-spacing:-.05em}.sub{text-align:center;margin:0 0 22px;color:#acb7d1;font-size:14px;line-height:1.6}
    .scores{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}.score{background:#ffffff0d;border:1px solid #ffffff14;border-radius:17px;text-align:center;padding:12px 6px}.score span{font-size:12px;color:#9caac9}.score strong{display:block;font-size:28px;margin-top:4px;font-variant-numeric:tabular-nums}
    .camera{position:relative;overflow:hidden;aspect-ratio:4/3;border-radius:22px;background:#050914;border:1px solid #ffffff24;display:grid;place-items:center}.camera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.camera .placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#a7b6d6;font-size:14px;line-height:1.7;background:radial-gradient(circle,#20325c88,#080d1c)}.camera.ready .placeholder{display:none}.camera .corner{position:absolute;width:24px;height:24px;border-color:#b2c5ff;border-style:solid;pointer-events:none}.tl{top:17px;left:17px;border-width:3px 0 0 3px;border-radius:7px 0 0 0}.tr{top:17px;right:17px;border-width:3px 3px 0 0;border-radius:0 7px 0 0}.bl{bottom:17px;left:17px;border-width:0 0 3px 3px;border-radius:0 0 0 7px}.br{bottom:17px;right:17px;border-width:0 3px 3px 0;border-radius:0 0 7px 0}.tag{position:absolute;top:15px;left:50%;transform:translateX(-50%);background:#0b1424b8;border:1px solid #ffffff25;border-radius:99px;padding:5px 13px;color:#dce6ff;font-size:11px;white-space:nowrap}
    .result{min-height:100px;border-radius:18px;background:#ffffff0b;border:1px solid #ffffff13;margin:16px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center}.result strong{font-size:21px}.result p{margin:0;color:#a8b7d5;font-size:13px;line-height:1.6;overflow-wrap:anywhere}.moves{font-size:20px;letter-spacing:-.02em}
    button{font:inherit;cursor:pointer;border:0}.primary{width:100%;min-height:56px;border-radius:17px;color:#0b1530;font-size:16px;font-weight:800;background:linear-gradient(120deg,#b3caff,#79a4ff);box-shadow:0 12px 35px #5182ff30}.primary:disabled{opacity:.5;cursor:not-allowed}.secondary{background:none;color:#a3b7e4;padding:12px;width:100%;margin-top:8px;font-size:13px}.footer{text-align:center;color:#7384a5;font-size:12px;line-height:1.6;margin-top:12px}.hidden{display:none!important}
    @media(max-width:420px){body{padding:10px}.app{padding:18px;border-radius:24px}.camera{aspect-ratio:1/1}}
  </style>
</head>
<body>
  <main class="app">
    <div class="eyebrow">Computer vision game</div>
    <h1 class="heading">✊ AI 가위바위보</h1>
    <p class="sub">카메라에 손을 보여주고 버튼을 누르세요.<br>AI가 가위·바위·보를 직접 판별합니다.</p>
    <section class="scores" aria-label="점수판">
      <div class="score"><span>나</span><strong id="myScore">0</strong></div>
      <div class="score"><span>무승부</span><strong id="drawScore">0</strong></div>
      <div class="score"><span>AI</span><strong id="aiScore">0</strong></div>
    </section>
    <div class="camera" id="camera">
      <video id="video" autoplay muted playsinline></video>
      <div class="placeholder" id="placeholder">📷<br>카메라 시작 버튼을 눌러주세요.<br>카메라 접근 권한이 필요합니다.</div>
      <div class="tag">LIVE · 손을 화면 중앙에 놓으세요</div>
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    </div>
    <section class="result" aria-live="polite" aria-atomic="true">
      <strong id="resultTitle">게임 준비 완료</strong>
      <div class="moves hidden" id="moves"></div>
      <p id="resultDetail">카메라를 켜면 시작할 수 있어요.</p>
    </section>
    <button class="primary" id="playBtn" type="button">카메라 시작</button>
    <button class="secondary" id="resetBtn" type="button">점수 초기화</button>
    <div class="footer">인식 결과가 없거나 오류가 발생하면 해당 판은 무효입니다.</div>
    <canvas id="canvas" class="hidden"></canvas>
  </main>
<script>
'use strict';
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const camera=document.getElementById('camera');
const playBtn=document.getElementById('playBtn');
const resetBtn=document.getElementById('resetBtn');
const resultTitle=document.getElementById('resultTitle');
const resultDetail=document.getElementById('resultDetail');
const moves=document.getElementById('moves');
const myScore=document.getElementById('myScore');
const aiScore=document.getElementById('aiScore');
const drawScore=document.getElementById('drawScore');
let stream=null, busy=false, score={me:0,ai:0,draw:0};
const emoji={rock:'✊',paper:'✋',scissors:'✌️'};
const label={rock:'바위',paper:'보',scissors:'가위'};
function updateScores(){myScore.textContent=score.me;aiScore.textContent=score.ai;drawScore.textContent=score.draw;}
function show(title,detail,moveText=''){resultTitle.textContent=title;resultDetail.textContent=detail;moves.textContent=moveText;moves.classList.toggle('hidden',!moveText);}
function normalizeClass(raw){if(typeof raw!=='string')return null;let s=raw.trim().toLowerCase().replace(/[\s_-]/g,'');if(['rock','fist','stone','바위','주먹'].includes(s))return 'rock';if(['paper','palm','openhand','보','펴진손'].includes(s))return 'paper';if(['scissors','scissor','vsign','victory','peace','가위'].includes(s))return 'scissors';return null;}
function extractMove(data){const candidates=[];const visited=new Set();function walk(node,depth){if(depth>9||node==null||typeof node!=='object'||visited.has(node))return;visited.add(node);if(Array.isArray(node)){for(const item of node)walk(item,depth+1);return;}
  const cls=normalizeClass(node.class??node.class_name??node.label??node.name);
  if(cls){const confidence=Number(node.confidence??node.score??node.class_confidence??1);if(Number.isFinite(confidence))candidates.push({cls,confidence});}
  if(node.top&&typeof node.top==='string'){const top=normalizeClass(node.top);if(top)candidates.push({cls:top,confidence:Number(node.confidence??1)});}
  if(node.predicted_class){const predicted=normalizeClass(node.predicted_class);if(predicted)candidates.push({cls:predicted,confidence:Number(node.confidence??1)});}
  for(const [key,val] of Object.entries(node)){if(['class','class_name','label','name','top','predicted_class','image','visualization','base64','image_base64'].includes(key))continue;
    const named=normalizeClass(key);if(named&&typeof val==='number')candidates.push({cls:named,confidence:val});
    if(val&&typeof val==='object')walk(val,depth+1);
  }
}walk(data,0);candidates.sort((a,b)=>b.confidence-a.confidence);return candidates[0]&&candidates[0].confidence>=0.4?candidates[0].cls:null;}
async function startCamera(){if(!navigator.mediaDevices?.getUserMedia)throw Error('이 브라우저에서 카메라 기능을 사용할 수 없습니다. HTTPS 주소인지 확인하세요.');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}});video.srcObject=stream;await video.play();camera.classList.add('ready');playBtn.textContent='✊ 가위바위보!';show('준비 완료','손 모양을 만든 뒤 버튼을 누르세요.');}
function capture(){if(!video.videoWidth||!video.videoHeight)throw Error('카메라 영상이 준비되지 않았습니다.');const maxWidth=640;const width=Math.min(maxWidth,video.videoWidth);const height=Math.round(video.videoHeight*width/video.videoWidth);canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');ctx.drawImage(video,0,0,width,height);return canvas.toDataURL('image/jpeg',0.75).split(',')[1];}
async function round(){const image=capture();const response=await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image})});let data;try{data=await response.json()}catch{throw Error(`서버 응답을 읽을 수 없습니다 (HTTP ${response.status}).`)}if(!response.ok)throw Error(data.error||data.details||`HTTP ${response.status}`);
 const userMove=extractMove(data);if(!userMove){show('❌ 이번 판 무효','AI가 가위·바위·보를 확실히 인식하지 못했습니다. 손을 선명하게 보여주세요.');return;}
 const aiMove=['rock','paper','scissors'][Math.floor(Math.random()*3)];const moveText=`나 ${emoji[userMove]} ${label[userMove]}  vs  ${emoji[aiMove]} ${label[aiMove]} AI`;
 if(userMove===aiMove){score.draw++;show('🤝 무승부!', '두 사람 모두 같은 손을 냈어요.',moveText)}
 else if((userMove==='rock'&&aiMove==='scissors')||(userMove==='paper'&&aiMove==='rock')||(userMove==='scissors'&&aiMove==='paper')){score.me++;show('🎉 승리!', '이번 판은 당신이 이겼어요.',moveText)}
 else{score.ai++;show('AI 승리!', '다음 판에 다시 도전해 보세요.',moveText)}updateScores();}
playBtn.addEventListener('click',async()=>{if(busy)return;busy=true;playBtn.disabled=true;try{if(!stream){playBtn.textContent='카메라 연결 중…';await startCamera();}else{playBtn.textContent='AI 인식 중…';show('🔎 인식 중…','손 모양을 분석하고 있어요.');await round();}}catch(error){const message=error.name==='NotAllowedError'?'카메라 접근이 거부되었습니다. 브라우저에서 카메라 권한을 허용하세요.':error.message||'알 수 없는 오류';show(stream?'❌ 이번 판 무효':'카메라 오류',message);if(!stream)playBtn.textContent='카메라 다시 시작';}finally{busy=false;playBtn.disabled=false;if(stream)playBtn.textContent='✊ 다시 가위바위보!';}});
resetBtn.addEventListener('click',()=>{score={me:0,ai:0,draw:0};updateScores();show('점수 초기화 완료','카메라로 새로운 판을 시작하세요.');});
window.addEventListener('pagehide',()=>stream?.getTracks().forEach(track=>track.stop()));
</script>
</body>
</html>
